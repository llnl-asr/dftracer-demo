# -----------------------------------------------------------------------------
# dftracer-demo configuration
#
# Single source of truth for modules, paths, software versions, Slurm settings
# and benchmark parameters. Consumed by activate_env.sh, setup.sh and every
# demo step script through scripts/load_config.py.
#
# * Values may reference environment variables (${USER}, ${HOME}, ...) and
#   ${DEMO_ROOT} (the repository root) or any key defined above them.
# * Each key is exported to the shell as DEMO_<SECTION>_<KEY> (upper-case),
#   e.g. paths.traces -> DEMO_PATHS_TRACES, ior.tasks -> DEMO_IOR_TASKS.
#   Lists are exported space separated. Keys under `env` are exported as-is.
# * Each paths.<key> is also exported as DEMO_<KEY>, so a path defined here can
#   be reused by any value below it: add `pfs: /p/lustre5/${USER}` and then
#   write `${DEMO_PFS}/test`. The standard paths (DEMO_INSTALL, DEMO_DATA, ...)
#   are available everywhere, even when left out.
# * An empty or removed key is not exported, so its flag is left out of every
#   command (paths.* fall back to ${DEMO_ROOT}/<name>).
# * Override the file with DEMO_CONFIG=/path/to/other.yaml.
#
# Defaults target Matrix @ LLNL (Slurm, TOSS 4).
# -----------------------------------------------------------------------------

modules:
  purge: false            # run `module purge` before loading
  load:                   # loaded in order by activate_env.sh
    - gcc/12.1.1
    - openmpi/4.1.2
    - python/3.11.5
  # Mogon (JGU Mainz) equivalent:
  #   - mpi/OpenMPI/5.0.3-GCC-13.3.0
  #   - lang/Python/3.12.3-GCCcore-13.3.0

# Extra environment variables exported verbatim by activate_env.sh.
env:
  OMPI_MCA_btl: ^openib                       # Matrix: no openib warnings
  OMPI_MCA_opal_common_ucx_opal_mem_hooks: 1  # Matrix: silence UCX VM_UNMAP warning
  PIP_EXTRA_INDEX_URL: https://pypi.org/simple  # override unreachable extra indexes from personal pip.conf

paths:
  install: ${DEMO_ROOT}/install           # python venv + IOR binaries
  build: ${DEMO_ROOT}/build               # source checkouts built by setup.sh
  pfs: /p/lustre5/${USER}                 # parallel file system; reuse as ${DEMO_PFS}
  data: ${DEMO_PFS}/dftracer-demo         # benchmark data (the I/O being traced)
  traces: ${DEMO_ROOT}/traces             # DFTracer trace logs (*.pfw.gz)
  results: ${DEMO_ROOT}/results           # benchmark + analysis output
  runs: ${DEMO_ROOT}/runs                 # Slurm job stdout/stderr and run logs

software:
  ior:
    repo: https://github.com/hpc/ior.git
    ref: 4.0.0
  node: lts               # Node.js for the dftracer_server web UI (nodeenv version)
  # pip-installed in this order; latest development heads.
  python:
    - dftracer-utils==0.0.12.post1.dev131
    - git+https://github.com/llnl-asr/pydftracer.git@develop
    - dftracer==2.1.1.post45
    - git+https://github.com/llnl-asr/dfanalyzer.git@develop
    - git+https://github.com/argonne-lcf/dlio_benchmark.git@main

slurm:
  partition: pdebug
  account: ""             # empty -> your default bank
  time: "00:15:00"        # short limits backfill sooner on a busy pdebug
  extra: ""               # extra sbatch flags, e.g. "--qos=standby"
  mpi: pmix_v3            # srun --mpi plugin used to launch MPI ranks

dftracer:
  inc_metadata: 1
  compression: 1

ior:
  nodes: 1
  tasks: 2
  app_name: ior
  # 32MB block, 1MB transfer, 5 iterations, file-per-process, write-only
  args: -b 32m -t 1m -i 5 -F -w -m

dlio:
  nodes: 1
  tasks: 2
  app_name: unet3d
  workload: unet3d_a100
  num_files_train: 32
  record_length_bytes: 1048576
  batch_size: 1
  epochs: 1
  extra: ""               # extra hydra overrides, e.g. "++workload.reader.read_threads=2"

analyzer:
  time_granularity: 10

viewer:
  port: 8080
  time: "01:00:00"        # how long the dftracer_server job stays up
  browser: firefox        # opened on the login node when $DISPLAY is set
  proxy: true             # relay the viewer through the login node (http://<login>:<port>/)
